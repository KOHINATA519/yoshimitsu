<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品登録</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>商品登録</h1>

<p>カテゴリー</p>

<select id="category">
<option>肉</option>
<option>魚</option>
<option>野菜</option>
<option>新商品</option>
</select>

<p>商品名</p>
<input id="product_name">

<p>価格</p>
<input id="price">

<p>陳列コーナー</p>
<input id="corner">

<br><br>

<button id="saveBtn" onclick="saveData()">
登録
</button>

<hr>

<h2>状態</h2>

<p id="status">
入力待ち
</p>
<script>

const supabaseUrl =
"https://llxysqzozhnikuznsuwy.supabase.co";

/*
ここに Publishable Key を貼る
*/
const supabaseKey = "sb_publishable_uv_8zUNxYc1tebjvnukzdg_nNF6kAip";

const client = supabase.createClient(
supabaseUrl,
supabaseKey
);

async function saveData(){

const { error } =
await client
.from("products")
.insert([
{
category:
document.getElementById("category").value,

product_name:
document.getElementById("product_name").value,

price:
document.getElementById("price").value,

corner:
document.getElementById("corner").value
}
]);

if(error){

document.getElementById("result").innerText =
"登録失敗";

}else{

document.getElementById("result").innerText =
"登録完了";

}

}

</script>

</body>
</html>
