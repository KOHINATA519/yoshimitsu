<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>店舗管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { max-width: 900px; margin: auto; padding: 20px; font-size: 20px; line-height: 1.7; font-family: Arial, sans-serif; }
    input, select, button, textarea { box-sizing: border-box; width: 100%; margin: 6px 0 12px; padding: 10px; font-size: 20px; }
    textarea { min-height: 160px; line-height: 1.6; }
    button { cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .card { border: 1px solid #ccc; padding: 12px; margin: 12px 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; }
    .actions button { width: 50%; }
    .delete-button { color: #a00; background: #fff0f0; }
    .bulk-delete-button { color: #a00; background: #fff0f0; }
    .product-select, #selectAllProducts { width: auto; margin: 0 8px 0 0; }
    .schedule-input { display: none; }
    .error { color: #b00020; }
    .success { color: green; }
    [hidden] { display: none !important; }
    @media (max-width: 500px) { body { padding: 12px; font-size: 18px; } input, select, button, textarea { font-size: 18px; } }
  </style>
</head>
<body>
  <h1 id="pageHeading">店舗管理</h1>

  <section id="loginPanel">
    <h2 id="loginHeading">管理者ログイン</h2>
    <label for="loginEmail">メールアドレス</label>
    <input id="loginEmail" type="email" autocomplete="username">
    <label for="loginPassword">パスワード</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <button id="loginButton" type="button" onclick="login()">ログイン</button>
    <p id="loginStatus" aria-live="polite"></p>
  </section>

  <main id="adminPanel" hidden>
    <p id="signedInAs"></p>
    <p id="storeLabel"></p>
    <p><a id="publicSiteLink" href="#">店舗サイトを開く</a></p>
    <p><a id="hqLink" href="hq.html" hidden>本部管理へ</a></p>
    <button type="button" onclick="logout()">ログアウト</button>

    <hr>
    <h2>カテゴリー管理</h2>
    <label for="newCategoryName">新しいカテゴリー名</label>
    <input id="newCategoryName" placeholder="例：お菓子">
    <button type="button" onclick="addCategory()">カテゴリーを追加</button>
    <p id="categoryStatus" aria-live="polite"></p>
    <div id="categoryList" aria-live="polite"></div>

    <hr>
    <h2>商品登録・編集</h2>
    <label for="category">カテゴリー</label>
    <select id="category">
      <option value="">カテゴリーを選択してください</option>
    </select>
    <label for="productName">商品名</label>
    <input id="productName">
    <label for="productPrice">価格</label>
    <input id="productPrice" placeholder="例：88円">
    <label for="productCorner">陳列コーナー</label>
    <input id="productCorner" placeholder="例：精肉売場">
    <h3>掲載時期</h3>
    <label for="productPublishMode">掲載開始</label>
    <select id="productPublishMode" onchange="updateScheduleControls('product')">
      <option value="now">今日から掲載</option>
      <option value="tomorrow">明日から掲載</option>
      <option value="week">1週間後から掲載</option>
      <option value="custom">日付を指定</option>
    </select>
    <input id="productPublishAtCustom" class="schedule-input" type="date" aria-label="掲載開始日">
    <label for="productUnpublishMode">掲載終了</label>
    <select id="productUnpublishMode" onchange="updateScheduleControls('product')">
      <option value="none">終了日を設定しない</option>
      <option value="1day">掲載開始から1日間</option>
      <option value="7days">掲載開始から7日間</option>
      <option value="30days">掲載開始から30日間</option>
      <option value="custom">終了日を指定</option>
    </select>
    <input id="productUnpublishAtCustom" class="schedule-input" type="date" aria-label="掲載終了日">
    <button id="productSaveButton" type="button" onclick="saveProduct()">商品を登録</button>
    <button id="productCancelButton" type="button" onclick="cancelProductEdit()" hidden>編集をキャンセル</button>
    <p id="productStatus" aria-live="polite"></p>

    <h3>商品をまとめて登録</h3>
    <p>ここで掲載時期を一度選ぶと、下に入力した商品すべてに同じ設定が適用されます。</p>
    <label for="bulkPublishMode">掲載開始</label>
    <select id="bulkPublishMode" onchange="updateScheduleControls('bulk')">
      <option value="now">今日から掲載</option>
      <option value="tomorrow">明日から掲載</option>
      <option value="week">1週間後から掲載</option>
      <option value="custom">日付を指定</option>
    </select>
    <input id="bulkPublishAtCustom" class="schedule-input" type="date" aria-label="一括掲載開始日">
    <label for="bulkUnpublishMode">掲載終了</label>
    <select id="bulkUnpublishMode" onchange="updateScheduleControls('bulk')">
      <option value="none">終了日を設定しない</option>
      <option value="1day">掲載開始から1日間</option>
      <option value="7days">掲載開始から7日間</option>
      <option value="30days">掲載開始から30日間</option>
      <option value="custom">終了日を指定</option>
    </select>
    <input id="bulkUnpublishAtCustom" class="schedule-input" type="date" aria-label="一括掲載終了日">
    <p>ジャンルごとに自動で振り分ける場合：ジャンル | 商品名 | 価格 | 陳列コーナー</p>
    <p>未登録ジャンルは「ジャンル名コーナー特売」というカテゴリーを自動作成します。従来どおり上のカテゴリーを選ぶ場合は、商品名 | 価格 | 陳列コーナー の形式も使えます。</p>
    <textarea id="bulkProducts" placeholder="肉 | 豚こま切れ | 88円 | 精肉売場&#10;日用品 | 洗剤 | 198円 | 日用品売場"></textarea>
    <button id="bulkSaveButton" type="button" onclick="bulkSaveProducts()">まとめて登録</button>
    <p id="bulkStatus" aria-live="polite"></p>
    <h3>登録済み商品</h3>
    <label><input id="selectAllProducts" type="checkbox" onchange="toggleAllProducts(this.checked)">表示中の商品をすべて選択</label>
    <button id="bulkDeleteProductsButton" class="bulk-delete-button" type="button" onclick="deleteSelectedProducts()" disabled>選択した商品をまとめて削除</button>
    <p id="bulkDeleteStatus" aria-live="polite"></p>
    <div id="productList" aria-live="polite"></div>

    <hr>
    <h2>お知らせ登録・編集</h2>
    <label for="noticeMessage">お知らせ文</label>
    <input id="noticeMessage" placeholder="例：本日の特売情報を更新しました">
    <label for="noticeLinkText">リンク文字（省略可）</label>
    <input id="noticeLinkText" placeholder="例：公式Instagram">
    <label for="noticeLinkUrl">リンク先URL（省略可）</label>
    <input id="noticeLinkUrl" type="url" placeholder="https://example.com">
    <button id="noticeSaveButton" type="button" onclick="saveAnnouncement()">お知らせを登録</button>
    <button id="noticeCancelButton" type="button" onclick="cancelAnnouncementEdit()" hidden>編集をキャンセル</button>
    <p id="noticeStatus" aria-live="polite"></p>
    <h3>登録済みお知らせ</h3>
    <div id="announcementList" aria-live="polite"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://llxysqzozhnikuznsuwy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uv_8zUNxYc1tebjvnukzdg_nNF6kAip";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const storeSlug = new URLSearchParams(location.search).get("store");
    let store = null;
    let editingProductId = null;
    let editingAnnouncementId = null;
    let loadedUserId = null;

    function status(id, message, type) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = type || "";
    }

    async function login() {
      const button = document.getElementById("loginButton");
      button.disabled = true;
      status("loginStatus", "ログイン中...");
      const result = await client.auth.signInWithPassword({
        email: document.getElementById("loginEmail").value.trim(),
        password: document.getElementById("loginPassword").value
      });
      button.disabled = false;
      if (result.error) {
        status("loginStatus", "ログインできませんでした。入力内容を確認してください。", "error");
        return;
      }
      document.getElementById("loginPassword").value = "";
      await checkSession();
    }

    async function loadLoginStoreName() {
      if (!storeSlug) {
        document.title = "店舗管理者ログイン｜スーパー吉光";
        return;
      }
      const { data, error } = await client.from("stores")
        .select("name")
        .eq("slug", storeSlug)
        .eq("is_active", true)
        .maybeSingle();
      if (error || !data) {
        document.getElementById("pageHeading").textContent = "店舗が見つかりません";
        document.getElementById("loginHeading").textContent = "店舗管理者ログイン";
        document.title = "店舗が見つかりません｜スーパー吉光";
        return;
      }
      document.getElementById("pageHeading").textContent = data.name + " 管理ページ";
      document.getElementById("loginHeading").textContent = data.name + " 管理者ログイン";
      document.title = data.name + " 管理者ログイン｜スーパー吉光";
    }

    async function logout() {
      const result = await client.auth.signOut();
      if (result.error) {
        status("loginStatus", "ログアウトできませんでした：" + result.error.message, "error");
        return;
      }
      loadedUserId = null;
      await checkSession();
    }

    async function checkSession() {
      const { data, error } = await client.auth.getSession();
      if (error) {
        status("loginStatus", "ログイン状態を確認できませんでした。", "error");
        return;
      }
      const session = data.session;
      if (!session) {
        document.getElementById("loginPanel").hidden = false;
        document.getElementById("adminPanel").hidden = true;
        return;
      }

      const storeResult = await client.from("stores")
        .select("id, name, slug, is_active")
        .eq("slug", storeSlug || "")
        .maybeSingle();

      if (storeResult.error || !storeResult.data || !storeResult.data.is_active) {
        document.getElementById("loginPanel").hidden = false;
        document.getElementById("adminPanel").hidden = true;
        status("loginStatus", "店舗が見つからないか、停止中です。", "error");
        return;
      }
      store = storeResult.data;

      const memberResult = await client.from("store_memberships")
        .select("role")
        .eq("store_id", store.id)
        .eq("user_id", session.user.id)
        .maybeSingle();

      const hqResult = await client.rpc("is_hq_admin");
      const isHq = !hqResult.error && hqResult.data === true;

      if ((!memberResult.data || memberResult.error) && !isHq) {
        document.getElementById("loginPanel").hidden = false;
        document.getElementById("adminPanel").hidden = true;
        status("loginStatus", "この店舗の管理権限がありません。", "error");
        return;
      }

      document.getElementById("loginPanel").hidden = true;
      document.getElementById("adminPanel").hidden = false;
      document.getElementById("pageHeading").textContent = store.name + " 管理ページ";
      document.getElementById("storeLabel").textContent = "管理対象：" + store.name;
      document.getElementById("signedInAs").textContent = "ログイン中：" + (session.user.email || "");
      document.getElementById("hqLink").hidden = !isHq;
      const publicUrl = new URL("index.html", location.href);
      publicUrl.searchParams.set("store", store.slug);
      document.getElementById("publicSiteLink").href = publicUrl.href;

      if (loadedUserId !== session.user.id || !window.storeDataLoaded) {
        loadedUserId = session.user.id;
        window.storeDataLoaded = true;
        await loadAll();
      }
    }

    client.auth.onAuthStateChange(function() {
      setTimeout(checkSession, 0);
    });

    async function loadAll() {
      await Promise.all([loadCategories(), loadProducts(), loadAnnouncements()]);
    }

    async function loadCategories() {
      const select = document.getElementById("category");
      const list = document.getElementById("categoryList");
      const oldValue = select.value;
      const { data, error } = await client.from("categories")
        .select("name")
        .eq("store_id", store.id)
        .order("created_at", { ascending: true });

      if (error) {
        list.textContent = "カテゴリー読込失敗：" + error.message;
        return;
      }
      select.replaceChildren();
      list.replaceChildren();

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "カテゴリーを選択してください";
      select.appendChild(placeholder);

      for (const item of data || []) {
        const option = document.createElement("option");
        option.value = item.name;
        option.textContent = item.name;
        select.appendChild(option);

        const row = document.createElement("p");
        row.append(document.createTextNode(item.name + " "));
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "削除";
        button.addEventListener("click", function() { deleteCategory(item.name); });
        row.appendChild(button);
        list.appendChild(row);
      }

      if (!data || !data.length) {
        select.innerHTML = '<option value="">カテゴリーがありません</option>';
        list.textContent = "カテゴリーがありません。";
      } else if (oldValue && [...select.options].some(function(option) { return option.value === oldValue; })) {
        select.value = oldValue;
      } else {
        select.value = "";
      }
    }

    async function addCategory() {
      const rawName = document.getElementById("newCategoryName").value.trim();
      if (!rawName) {
        status("categoryStatus", "カテゴリー名を入力してください。", "error");
        return;
      }
      const name = normalizeCategoryName(rawName);
      try {
        const added = await ensureCategory(name, rawName);
        if (!added) {
          status("categoryStatus", "同じカテゴリーがすでにあります。", "error");
          return;
        }
      } catch (error) {
        status("categoryStatus", error.code === "23505" ? "同じカテゴリーがすでにあります。" : "追加失敗：" + error.message, "error");
        return;
      }
      document.getElementById("newCategoryName").value = "";
      status("categoryStatus", "カテゴリーを追加しました。", "success");
      await loadCategories();
    }

    function normalizeCategoryName(name) {
      const trimmed = String(name || "").trim();
      return trimmed.endsWith("コーナー特売") ? trimmed : trimmed + "コーナー特売";
    }

    async function ensureCategory(name, originalName) {
      const { data, error: findError } = await client.from("categories")
        .select("name")
        .eq("store_id", store.id)
        .eq("name", name)
        .maybeSingle();
      if (findError) throw findError;
      if (data) return false;

      if (originalName && originalName !== name) {
        const { data: oldCategory, error: oldFindError } = await client.from("categories")
          .select("name")
          .eq("store_id", store.id)
          .eq("name", originalName)
          .maybeSingle();
        if (oldFindError) throw oldFindError;
        if (oldCategory) {
          const { error: renameError } = await client.from("categories")
            .update({ name: name })
            .eq("store_id", store.id)
            .eq("name", originalName);
          if (renameError) throw renameError;
          return true;
        }
      }

      const { error: insertError } = await client.from("categories")
        .insert([{ store_id: store.id, name: name }]);
      if (insertError && insertError.code !== "23505") throw insertError;
      return !insertError;
    }

    async function deleteCategory(name) {
      if (!confirm("「" + name + "」を削除しますか？商品が残っている場合は削除できません。")) return;
      const { error } = await client.from("categories")
        .delete().eq("store_id", store.id).eq("name", name);
      if (error) {
        status("categoryStatus", error.code === "23503"
          ? "商品が残っているため削除できません。商品を別カテゴリーへ移すか削除してください。"
          : "削除失敗：" + error.message, "error");
        return;
      }
      status("categoryStatus", "カテゴリーを削除しました。", "success");
      await loadCategories();
    }

    async function loadProducts() {
      const area = document.getElementById("productList");
      area.textContent = "読込中...";
      const { data, error } = await client.from("products")
        .select("id, category, product_name, price, corner, created_at, updated_at, publish_at, unpublish_at")
        .eq("store_id", store.id).order("id", { ascending: false });
      if (error) {
        area.textContent = "商品を読み込めませんでした：" + error.message;
        return;
      }
      area.replaceChildren();
      document.getElementById("selectAllProducts").checked = false;
      updateBulkDeleteButton();
      if (!data || !data.length) {
        area.textContent = "商品はありません。";
        return;
      }
      for (const item of data) {
        const card = document.createElement("section");
        card.className = "card";
        const selectLabel = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "product-select";
        checkbox.value = String(item.id);
        checkbox.setAttribute("aria-label", item.product_name + "を選択");
        checkbox.addEventListener("change", updateBulkDeleteButton);
        selectLabel.append(checkbox, document.createTextNode("まとめて削除する商品にチェック"));
        const details = document.createElement("p");
        details.textContent = item.category + "：" + item.product_name + "／価格：" + item.price + "／陳列コーナー：" + item.corner;
        const schedule = document.createElement("p");
        const now = new Date();
        const publishDate = new Date(item.publish_at);
        const unpublishDate = item.unpublish_at ? new Date(item.unpublish_at) : null;
        const state = publishDate > now ? "掲載予約中" : (unpublishDate && unpublishDate <= now ? "掲載終了" : "掲載中");
        schedule.textContent = "登録日時：" + formatAdminDate(item.created_at) + "／" + state + "／掲載開始日：" + formatAdminDay(item.publish_at) + "／掲載終了日：" + (item.unpublish_at ? formatAdminDay(jstMidnightIso(shiftDateString(toJstDateInput(item.unpublish_at), -1))) : "設定なし");
        const actions = document.createElement("div");
        actions.className = "actions";
        const edit = document.createElement("button");
        edit.type = "button"; edit.textContent = "編集";
        edit.addEventListener("click", function() { editProduct(item); });
        const del = document.createElement("button");
        del.type = "button"; del.className = "delete-button"; del.textContent = "削除";
        del.addEventListener("click", function() { deleteProduct(item.id); });
        actions.append(edit, del);
        card.append(selectLabel, details, schedule, actions);
        area.appendChild(card);
      }
    }

    function formatAdminDate(value) {
      if (!value) return "未設定";
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
      }).format(new Date(value));
    }

    function formatAdminDay(value) {
      if (!value) return "未設定";
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date(value));
    }

    function jstDateString(date) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(date);
      const values = Object.fromEntries(parts.map(function(part) { return [part.type, part.value]; }));
      return values.year + "-" + values.month + "-" + values.day;
    }

    function shiftDateString(dateString, days) {
      const date = new Date(dateString + "T00:00:00+09:00");
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    }

    function jstMidnightIso(dateString) {
      return new Date(dateString + "T00:00:00+09:00").toISOString();
    }

    function toJstDateInput(value) {
      return value ? jstDateString(new Date(value)) : "";
    }

    function updateScheduleControls(prefix) {
      document.getElementById(prefix + "PublishAtCustom").style.display =
        document.getElementById(prefix + "PublishMode").value === "custom" ? "block" : "none";
      document.getElementById(prefix + "UnpublishAtCustom").style.display =
        document.getElementById(prefix + "UnpublishMode").value === "custom" ? "block" : "none";
    }

    function readSchedule(prefix) {
      const publishMode = document.getElementById(prefix + "PublishMode").value;
      const unpublishMode = document.getElementById(prefix + "UnpublishMode").value;
      const publishAtCustom = document.getElementById(prefix + "PublishAtCustom").value;
      const unpublishAtCustom = document.getElementById(prefix + "UnpublishAtCustom").value;
      let startDate = jstDateString(new Date());
      if (publishMode === "tomorrow") startDate = shiftDateString(startDate, 1);
      if (publishMode === "week") startDate = shiftDateString(startDate, 7);
      if (publishMode === "custom") {
        if (!publishAtCustom) return { error: "掲載開始日を指定してください。" };
        startDate = publishAtCustom;
      }
      const start = new Date(jstMidnightIso(startDate));
      if (Number.isNaN(start.getTime())) return { error: "掲載開始日を確認してください。" };

      let end = null;
      if (["1day", "7days", "30days"].includes(unpublishMode)) {
        const days = unpublishMode === "1day" ? 1 : Number(unpublishMode.replace("days", ""));
        end = new Date(jstMidnightIso(shiftDateString(startDate, days)));
      } else if (unpublishMode === "custom") {
        if (!unpublishAtCustom) return { error: "掲載終了日を指定してください。" };
        end = new Date(jstMidnightIso(shiftDateString(unpublishAtCustom, 1)));
      }
      if (end && (Number.isNaN(end.getTime()) || end <= start)) {
        return { error: "掲載終了日は掲載開始日以降にしてください。" };
      }
      return { publish_at: start.toISOString(), unpublish_at: end ? end.toISOString() : null };
    }

    function toggleAllProducts(checked) {
      document.querySelectorAll("#productList .product-select").forEach(function(checkbox) {
        checkbox.checked = checked;
      });
      updateBulkDeleteButton();
    }

    function updateBulkDeleteButton() {
      const selectedCount = document.querySelectorAll("#productList .product-select:checked").length;
      const button = document.getElementById("bulkDeleteProductsButton");
      button.disabled = selectedCount === 0;
      button.textContent = selectedCount
        ? "選択した商品をまとめて削除（" + selectedCount + "件）"
        : "選択した商品をまとめて削除";
      const checkboxes = document.querySelectorAll("#productList .product-select");
      const selectAll = document.getElementById("selectAllProducts");
      selectAll.checked = checkboxes.length > 0 && selectedCount === checkboxes.length;
      selectAll.indeterminate = selectedCount > 0 && selectedCount < checkboxes.length;
    }

    async function deleteSelectedProducts() {
      const ids = Array.from(document.querySelectorAll("#productList .product-select:checked"))
        .map(function(checkbox) { return Number(checkbox.value); })
        .filter(Number.isFinite);
      if (!ids.length) {
        status("bulkDeleteStatus", "削除する商品を選んでください。", "error");
        return;
      }
      if (!confirm(ids.length + "件の商品を削除します。よろしいですか？")) return;

      const button = document.getElementById("bulkDeleteProductsButton");
      button.disabled = true;
      status("bulkDeleteStatus", "削除中...");
      const { error } = await client.from("products")
        .delete()
        .eq("store_id", store.id)
        .in("id", ids);
      if (error) {
        status("bulkDeleteStatus", "一括削除に失敗しました：" + error.message, "error");
        updateBulkDeleteButton();
        return;
      }
      status("bulkDeleteStatus", ids.length + "件の商品を削除しました。", "success");
      await loadProducts();
    }

    function editProduct(item) {
      editingProductId = item.id;
      document.getElementById("category").value = item.category;
      document.getElementById("productName").value = item.product_name || "";
      document.getElementById("productPrice").value = item.price || "";
      document.getElementById("productCorner").value = item.corner || "";
      document.getElementById("productPublishMode").value = "custom";
      document.getElementById("productPublishAtCustom").value = toJstDateInput(item.publish_at);
      document.getElementById("productUnpublishMode").value = item.unpublish_at ? "custom" : "none";
      document.getElementById("productUnpublishAtCustom").value = item.unpublish_at
        ? shiftDateString(toJstDateInput(item.unpublish_at), -1)
        : "";
      updateScheduleControls("product");
      document.getElementById("productSaveButton").textContent = "変更を保存";
      document.getElementById("productCancelButton").hidden = false;
      status("productStatus", "商品を編集中です。");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function saveProduct() {
      const schedule = readSchedule("product");
      if (schedule.error) {
        status("productStatus", schedule.error, "error");
        return;
      }
      const product = {
        store_id: store.id,
        category: document.getElementById("category").value,
        product_name: document.getElementById("productName").value.trim(),
        price: document.getElementById("productPrice").value.trim(),
        corner: document.getElementById("productCorner").value.trim(),
        publish_at: schedule.publish_at,
        unpublish_at: schedule.unpublish_at
      };
      if (!product.category || !product.product_name) {
        status("productStatus", "カテゴリーと商品名を入力してください。", "error");
        return;
      }
      const button = document.getElementById("productSaveButton");
      button.disabled = true;
      let result;
      if (editingProductId === null) {
        result = await client.from("products").insert([product]);
      } else {
        delete product.store_id;
        result = await client.from("products").update(product)
          .eq("id", editingProductId).eq("store_id", store.id);
      }
      button.disabled = false;
      if (result.error) {
        status("productStatus", "保存失敗：" + result.error.message, "error");
        return;
      }
      status("productStatus", editingProductId === null ? "商品を登録しました。" : "商品を更新しました。", "success");
      cancelProductEdit();
      await loadProducts();
    }

    async function bulkSaveProducts() {
      const schedule = readSchedule("bulk");
      if (schedule.error) {
        status("bulkStatus", schedule.error, "error");
        return;
      }
      const selectedCategory = document.getElementById("category").value;
      const input = document.getElementById("bulkProducts").value.trim();
      const button = document.getElementById("bulkSaveButton");
      if (!input) {
        status("bulkStatus", "商品を入力してください。", "error");
        return;
      }
      const parsedRows = [];
      const errors = [];
      input.split(/\r?\n/).forEach(function(line, index) {
        if (!line.trim()) return;
        const parts = line.split("|").map(function(part) { return part.trim(); });
        if (parts.length === 4 && parts[0] && parts[1]) {
          parsedRows.push({
            category: normalizeCategoryName(parts[0]),
            originalGenre: parts[0],
            product_name: parts[1], price: parts[2], corner: parts[3]
          });
        } else if (parts.length === 3 && parts[0]) {
          parsedRows.push({
            category: selectedCategory,
            product_name: parts[0], price: parts[1], corner: parts[2]
          });
        } else {
          errors.push((index + 1) + "行目");
        }
      });
      if (errors.length) {
        status("bulkStatus", errors.join("、") + "を確認してください。ジャンル付き：ジャンル | 商品名 | 価格 | 陳列コーナー", "error");
        return;
      }
      const usesSelectedCategory = parsedRows.some(function(row) { return !row.category; });
      if (usesSelectedCategory) {
        status("bulkStatus", "3項目形式を使う場合は、上のカテゴリーを選んでください。", "error");
        return;
      }
      button.disabled = true;
      status("bulkStatus", "登録中...");
      try {
        for (const row of parsedRows) {
          if (row.originalGenre) await ensureCategory(row.category, row.originalGenre);
        }
        const rows = parsedRows.map(function(row) {
          delete row.originalGenre;
          return { store_id: store.id, ...row, ...schedule };
        });
        const { error } = await client.from("products").insert(rows);
        if (error) throw error;
      } catch (error) {
        status("bulkStatus", "一括登録失敗：" + error.message, "error");
        button.disabled = false;
        return;
      }
      button.disabled = false;
      document.getElementById("bulkProducts").value = "";
      status("bulkStatus", parsedRows.length + "件を登録しました。必要なジャンルカテゴリーも追加しました。", "success");
      await loadCategories();
      await loadProducts();
    }

    async function deleteProduct(id) {
      if (!confirm("この商品を削除しますか？")) return;
      const { error } = await client.from("products").delete()
        .eq("id", id).eq("store_id", store.id);
      if (error) {
        status("productStatus", "削除失敗：" + error.message, "error");
        return;
      }
      status("productStatus", "商品を削除しました。", "success");
      await loadProducts();
    }

    function cancelProductEdit() {
      editingProductId = null;
      document.getElementById("productName").value = "";
      document.getElementById("productPrice").value = "";
      document.getElementById("productCorner").value = "";
      document.getElementById("productPublishMode").value = "now";
      document.getElementById("productPublishAtCustom").value = "";
      document.getElementById("productUnpublishMode").value = "none";
      document.getElementById("productUnpublishAtCustom").value = "";
      updateScheduleControls("product");
      document.getElementById("productSaveButton").textContent = "商品を登録";
      document.getElementById("productCancelButton").hidden = true;
    }

    async function loadAnnouncements() {
      const area = document.getElementById("announcementList");
      area.textContent = "読込中...";
      const { data, error } = await client.from("announcements")
        .select("id, message, link_text, link_url, created_at")
        .eq("store_id", store.id).order("created_at", { ascending: false });
      if (error) {
        area.textContent = "お知らせ読込失敗：" + error.message;
        return;
      }
      area.replaceChildren();
      if (!data || !data.length) {
        area.textContent = "お知らせはありません。";
        return;
      }
      for (const item of data) {
        const card = document.createElement("section");
        card.className = "card";
        const message = document.createElement("p");
        message.textContent = item.message || "";
        card.appendChild(message);
        if (item.link_url) {
          try {
            const url = new URL(item.link_url);
            if (url.protocol === "https:" || url.protocol === "http:") {
              const link = document.createElement("a");
              link.href = url.href; link.textContent = item.link_text || item.link_url;
              link.target = "_blank"; link.rel = "noopener noreferrer";
              card.appendChild(link);
            }
          } catch {}
        }
        const actions = document.createElement("div");
        actions.className = "actions";
        const edit = document.createElement("button");
        edit.type = "button"; edit.textContent = "編集";
        edit.addEventListener("click", function() { editAnnouncement(item); });
        const del = document.createElement("button");
        del.type = "button"; del.className = "delete-button"; del.textContent = "削除";
        del.addEventListener("click", function() { deleteAnnouncement(item.id); });
        actions.append(edit, del); card.appendChild(actions); area.appendChild(card);
      }
    }

    function editAnnouncement(item) {
      editingAnnouncementId = item.id;
      document.getElementById("noticeMessage").value = item.message || "";
      document.getElementById("noticeLinkText").value = item.link_text || "";
      document.getElementById("noticeLinkUrl").value = item.link_url || "";
      document.getElementById("noticeSaveButton").textContent = "変更を保存";
      document.getElementById("noticeCancelButton").hidden = false;
      status("noticeStatus", "お知らせを編集中です。");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function saveAnnouncement() {
      const message = document.getElementById("noticeMessage").value.trim();
      const linkText = document.getElementById("noticeLinkText").value.trim();
      const linkUrl = document.getElementById("noticeLinkUrl").value.trim();
      if (!message) {
        status("noticeStatus", "お知らせ文を入力してください。", "error");
        return;
      }
      if (linkUrl && !/^https?:\/\//i.test(linkUrl)) {
        status("noticeStatus", "リンクURLはhttp://またはhttps://で始めてください。", "error");
        return;
      }
      const record = { store_id: store.id, message: message, link_text: linkText || null, link_url: linkUrl || null };
      const button = document.getElementById("noticeSaveButton");
      button.disabled = true;
      let result;
      if (editingAnnouncementId === null) {
        result = await client.from("announcements").insert([record]);
      } else {
        delete record.store_id;
        result = await client.from("announcements").update(record)
          .eq("id", editingAnnouncementId).eq("store_id", store.id);
      }
      button.disabled = false;
      if (result.error) {
        status("noticeStatus", "保存失敗：" + result.error.message, "error");
        return;
      }
      status("noticeStatus", editingAnnouncementId === null ? "お知らせを登録しました。" : "お知らせを更新しました。", "success");
      cancelAnnouncementEdit();
      await loadAnnouncements();
    }

    async function deleteAnnouncement(id) {
      if (!confirm("このお知らせを削除しますか？")) return;
      const { error } = await client.from("announcements").delete()
        .eq("id", id).eq("store_id", store.id);
      if (error) {
        status("noticeStatus", "削除失敗：" + error.message, "error");
        return;
      }
      status("noticeStatus", "お知らせを削除しました。", "success");
      await loadAnnouncements();
    }

    function cancelAnnouncementEdit() {
      editingAnnouncementId = null;
      document.getElementById("noticeMessage").value = "";
      document.getElementById("noticeLinkText").value = "";
      document.getElementById("noticeLinkUrl").value = "";
      document.getElementById("noticeSaveButton").textContent = "お知らせを登録";
      document.getElementById("noticeCancelButton").hidden = true;
    }

    loadLoginStoreName();
    checkSession();
  </script>
</body>
</html>
