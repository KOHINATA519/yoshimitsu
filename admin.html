<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品登録管理画面</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      font-size: 22px;
      line-height: 1.8;
      font-family: sans-serif;
    }

    input, select, button {
      box-sizing: border-box;
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 22px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .card {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .card-actions button {
      margin: 0;
    }

    .delete-btn {
      color: #a00;
      background: #fff0f0;
    }

    .cancel-btn {
      background: #eee;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        font-size: 19px;
      }

      input, select, button {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <script>

const PASSWORD = "Yoshimitsu2026";

const password =
prompt("管理者パスワードを入力してください");

if(password !== PASSWORD){

document.body.innerHTML = `
<h1>アクセス拒否</h1>
<p>管理者のみ利用できます。</p>
`;

throw new Error("Unauthorized");

}

</script>
  <h1>スーパー吉光 チラシ商品登録</h1>

  <p>カテゴリー</p>
  <select id="category">
    <option>肉</option>
    <option>魚</option>
    <option>野菜</option>
    <option>その他特売</option>
    <option>新商品</option>
  </select>

  <p>商品名</p>
  <input id="product_name">

  <p>価格</p>
  <input id="price" inputmode="decimal">

  <p>陳列コーナー</p>
  <input id="corner">

  <button id="saveBtn" type="button" onclick="saveData()">登録</button>

  <button
    id="cancelEditBtn"
    class="cancel-btn"
    type="button"
    onclick="cancelEdit()"
    hidden
  >
    編集をキャンセル
  </button>

  <hr>

  <h2>状態</h2>
  <p id="status" aria-live="polite">入力待ち</p>

  <hr>

  <h2>最近登録した商品</h2>
  <div id="history" aria-live="polite">読込中...</div>

  <hr>

  <h2>お知らせを追加</h2>

  <p>お知らせ文</p>
  <input
    id="noticeMessage"
    placeholder="例：毎日、特売情報を更新しています"
  >

  <p>リンクに表示する文字（省略可）</p>
  <input
    id="noticeLinkText"
    placeholder="例：今週の特売を見る"
  >

  <p>リンク先URL（省略可）</p>
  <input
    id="noticeLinkUrl"
    type="url"
    placeholder="https://example.com"
  >

  <button id="noticeSaveBtn" type="button" onclick="addAnnouncement()">
    お知らせを登録
  </button>

  <div id="announcementStatus" aria-live="polite"></div>

  <h3>登録済みのお知らせ</h3>
  <div id="announcementAdminList" aria-live="polite">読込中...</div>

  <script>
    const supabaseUrl = "https://llxysqzozhnikuznsuwy.supabase.co";
    const supabaseKey = "sb_publishable_uv_8zUNxYc1tebjvnukzdg_nNF6kAip";
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    let editingId = null;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // 商品一覧を読み込む
    async function loadData() {
      const history = document.getElementById("history");
      history.textContent = "読込中...";

      const { data, error } = await client
        .from("products")
        .select("*")
        .order("id", { ascending: false })
        .limit(20);

      if (error) {
        history.innerHTML =
          `<p class="error">読込失敗：${escapeHtml(error.message)}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        history.textContent = "登録商品なし";
        return;
      }

      history.innerHTML = data.map(item => `
        <div class="card">
          <b>${escapeHtml(item.category)}</b><br>
          ${escapeHtml(item.product_name)}<br>
          ${escapeHtml(item.price)}<br>
          陳列コーナー：${escapeHtml(item.corner)}

          <div class="card-actions">
            <button
              type="button"
              onclick="startEdit(${JSON.stringify(item.id)})"
            >編集</button>

            <button
              class="delete-btn"
              type="button"
              onclick="deleteData(${JSON.stringify(item.id)})"
            >削除</button>
          </div>
        </div>
      `).join("");
    }

    // 商品を新規登録、または編集内容を保存
    async function saveData() {
      const status = document.getElementById("status");
      const btn = document.getElementById("saveBtn");

      const product = {
        category: document.getElementById("category").value,
        product_name: document.getElementById("product_name").value.trim(),
        price: document.getElementById("price").value.trim(),
        corner: document.getElementById("corner").value.trim()
      };

      if (!product.product_name) {
        status.innerHTML =
          "<span class='error'>商品名を入力してください。</span>";
        return;
      }

      btn.disabled = true;
      status.textContent = editingId === null ? "登録中..." : "更新中...";

      const result = editingId === null
        ? await client.from("products").insert([product])
        : await client.from("products").update(product).eq("id", editingId);

      if (result.error) {
        const action = editingId === null ? "登録" : "更新";
        status.innerHTML =
          `<span class="error">❌ ${action}失敗：${escapeHtml(result.error.message)}</span>`;
        btn.disabled = false;
        return;
      }

      const wasEditing = editingId !== null;
      status.innerHTML =
        `<span class="success">✅ ${wasEditing ? "更新" : "登録"}完了</span>`;

      resetForm();
      await loadData();
      btn.disabled = false;
    }

    // 商品を編集する
    async function startEdit(id) {
      const { data, error } = await client
        .from("products")
        .select("*")
        .eq("id", id)
        .single();

      if (error) {
        document.getElementById("status").innerHTML =
          `<span class="error">編集する商品を読み込めませんでした：${escapeHtml(error.message)}</span>`;
        return;
      }

      editingId = data.id;

      document.getElementById("category").value = data.category ?? "肉";
      document.getElementById("product_name").value = data.product_name ?? "";
      document.getElementById("price").value = data.price ?? "";
      document.getElementById("corner").value = data.corner ?? "";

      document.getElementById("saveBtn").textContent = "変更を保存";
      document.getElementById("cancelEditBtn").hidden = false;
      document.getElementById("status").textContent =
        "編集中です。内容を変更して保存してください。";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 商品を削除する
    async function deleteData(id) {
      if (!window.confirm("この商品を削除します。よろしいですか？")) {
        return;
      }

      const status = document.getElementById("status");
      status.textContent = "削除中...";

      const { error } = await client
        .from("products")
        .delete()
        .eq("id", id);

      if (error) {
        status.innerHTML =
          `<span class="error">❌ 削除失敗：${escapeHtml(error.message)}</span>`;
        return;
      }

      if (editingId !== null && String(editingId) === String(id)) {
        resetForm();
      }

      status.innerHTML = "<span class='success'>✅ 削除完了</span>";
      await loadData();
    }

    function cancelEdit() {
      resetForm();
      document.getElementById("status").textContent =
        "編集をキャンセルしました。";
    }

    function resetForm() {
      editingId = null;

      document.getElementById("product_name").value = "";
      document.getElementById("price").value = "";
      document.getElementById("corner").value = "";

      document.getElementById("saveBtn").textContent = "登録";
      document.getElementById("cancelEditBtn").hidden = true;
    }

    // お知らせを登録する
    async function addAnnouncement() {
      const message =
        document.getElementById("noticeMessage").value.trim();
      const linkText =
        document.getElementById("noticeLinkText").value.trim();
      const linkUrl =
        document.getElementById("noticeLinkUrl").value.trim();
      const status =
        document.getElementById("announcementStatus");
      const button =
        document.getElementById("noticeSaveBtn");

      if (!message) {
        status.innerHTML =
          "<span class='error'>お知らせ文を入力してください。</span>";
        return;
      }

      if (linkUrl && !/^https?:\/\//i.test(linkUrl)) {
        status.innerHTML =
          "<span class='error'>リンク先は http:// または https:// から入力してください。</span>";
        return;
      }

      button.disabled = true;
      status.textContent = "登録中...";

      const { error } = await client
        .from("announcements")
        .insert([{
          message: message,
          link_text: linkText || null,
          link_url: linkUrl || null
        }]);

      button.disabled = false;

      if (error) {
        status.innerHTML =
          `<span class="error">登録失敗：${escapeHtml(error.message)}</span>`;
        return;
      }

      status.innerHTML =
        "<span class='success'>お知らせを登録しました。</span>";

      document.getElementById("noticeMessage").value = "";
      document.getElementById("noticeLinkText").value = "";
      document.getElementById("noticeLinkUrl").value = "";

      await loadAnnouncementsForAdmin();
    }

    // 登録済みのお知らせを読み込む
    async function loadAnnouncementsForAdmin() {
      const area = document.getElementById("announcementAdminList");
      area.textContent = "読込中...";

      const { data, error } = await client
        .from("announcements")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        area.innerHTML =
          `<p class="error">読込失敗：${escapeHtml(error.message)}</p>`;
        return;
      }

      area.replaceChildren();

      if (!data || data.length === 0) {
        area.textContent = "お知らせはありません。";
        return;
      }

      for (const item of data) {
        const row = document.createElement("div");
        row.className = "card";

        const message = document.createElement("p");
        message.textContent = item.message;
        row.append(message);

        if (item.link_url) {
          const link = document.createElement("a");
          link.href = item.link_url;
          link.textContent = item.link_text || item.link_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          row.append(link);
        }

        const button = document.createElement("button");
        button.type = "button";
        button.className = "delete-btn";
        button.textContent = "このお知らせを削除";
        button.addEventListener("click", () => deleteAnnouncement(item.id));
        row.append(button);

        area.append(row);
      }
    }

    // お知らせを削除する
    async function deleteAnnouncement(id) {
      if (!window.confirm("このお知らせを削除しますか？")) {
        return;
      }

      const status = document.getElementById("announcementStatus");
      status.textContent = "削除中...";

      const { error } = await client
        .from("announcements")
        .delete()
        .eq("id", id);

      if (error) {
        status.innerHTML =
          `<span class="error">削除失敗：${escapeHtml(error.message)}</span>`;
        return;
      }

      status.innerHTML =
        "<span class='success'>お知らせを削除しました。</span>";

      await loadAnnouncementsForAdmin();
    }

    loadData();
    loadAnnouncementsForAdmin();
  </script>
</body>
</html>
