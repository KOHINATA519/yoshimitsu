<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スーパー吉光</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      font-size: 22px;
      line-height: 1.8;
      font-family: Arial, sans-serif;
    }

    a {
      font-size: 24px;
    }

    button {
      font-size: 20px;
      margin: 5px;
    }

    .announcement {
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }

    .announcement-date {
      color: #666;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>スーパー吉光</h1>

  <p>Dux利用者向けスーパー情報サイト</p>

  <button onclick="document.body.style.fontSize='30px'">
    文字を大きくする
  </button>

  <button onclick="document.body.style.fontSize='22px'">
    元に戻す
  </button>

  <h2>カテゴリー</h2>

  <ul>
    <li><a href="meat.html">肉コーナー特売</a></li>
    <li><a href="fish.html">魚コーナー特売</a></li>
    <li><a href="vegetable.html">野菜コーナー特売</a></li>
    <li><a href="newitem.html">新商品情報</a></li>
  </ul>

  <h2>お知らせ</h2>
  <div id="announcements">お知らせを読み込んでいます...</div>

  <hr>

  <p>
    <a href="yoshimitsu.html">スーパー吉光株式会社</a>
  </p>
 <p>
    Suported by</a>
  </p>

  <p>
    <a href="cognitio.html">Cognitio株式会社</a>
  </p>

  <script>
    const supabaseUrl = "https://llxysqzozhnikuznsuwy.supabase.co";
    const supabaseKey = "sb_publishable_uv_8zUNxYc1tebjvnukzdg_nNF6kAip";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function loadAnnouncements() {
      const area = document.getElementById("announcements");

      const { data, error } = await supabaseClient
        .from("announcements")
        .select("message, link_url, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        area.textContent = "お知らせを読み込めませんでした。";
        console.error("お知らせ読込エラー:", error.message);
        return;
      }

      area.replaceChildren();

      if (!data || data.length === 0) {
        area.textContent = "現在お知らせはありません。";
        return;
      }

      for (const item of data) {
        const article = document.createElement("div");
        article.className = "announcement";

        let validUrl = null;

        if (item.link_url) {
          try {
            const url = new URL(item.link_url);

            if (url.protocol === "https:" || url.protocol === "http:") {
              validUrl = url.href;
            }
          } catch {
            // URLが正しくない場合は、お知らせ文を通常のテキストで表示
          }
        }

        if (validUrl) {
          const messageLink = document.createElement("a");
          messageLink.href = validUrl;
          messageLink.textContent = item.message;
          messageLink.target = "_blank";
          messageLink.rel = "noopener noreferrer";
          article.appendChild(messageLink);
        } else {
          const message = document.createElement("p");
          message.textContent = item.message;
          article.appendChild(message);
        }

        if (item.created_at) {
          const date = document.createElement("div");
          date.className = "announcement-date";
          date.textContent =
            new Date(item.created_at).toLocaleDateString("ja-JP");
          article.appendChild(date);
        }

        area.appendChild(article);
      }
    }

    loadAnnouncements();
  </script>

</body>
</html>
</body>
</html>
