<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スーパー吉光 入間総本店</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      font-size: 22px;
      line-height: 1.8;
      font-family: Arial, sans-serif;
    }

    a {
      font-size: 1.1em;
    }

    button {
      font-size: 20px;
      margin: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .announcement {
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }

    .announcement-date {
      color: #666;
      font-size: 16px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>
  <h1>スーパー吉光</h1>

  <p>Dux利用者向けスーパー情報サイト</p>

  <button type="button" onclick="document.body.style.fontSize='30px'">
    文字を大きくする
  </button>

  <button type="button" onclick="document.body.style.fontSize='22px'">
    元に戻す
  </button>

  <h2>カテゴリー</h2>
  <ul id="categoryLinks" aria-live="polite">
    <li>カテゴリーを読み込んでいます...</li>
  </ul>

  <h2>お知らせ</h2>
  <div id="announcements" aria-live="polite">
    お知らせを読み込んでいます...
  </div>

  <hr>

  <p>
    <a href="yoshimitsu.html">スーパー吉光株式会社</a>
  </p>

  <p>Supported by</p>

  <p>
    <a href="cognitio.html">Cognitio株式会社</a>
  </p>

  <script>
    const SUPABASE_URL = "https://llxysqzozhnikuznsuwy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_uv_8zUNxYc1tebjvnukzdg_nNF6kAip";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function loadCategories() {
      const list = document.getElementById("categoryLinks");

      const { data, error } = await supabaseClient
        .from("categories")
        .select("name")
        .order("created_at", { ascending: true });

      if (error) {
        list.innerHTML = "<li>カテゴリーを読み込めませんでした。</li>";
        console.error("カテゴリー読込エラー:", error.message);
        return;
      }

      list.replaceChildren();

      if (!data || data.length === 0) {
        list.innerHTML = "<li>カテゴリーがありません。</li>";
        return;
      }

      const standardLabels = {
        "肉": "肉コーナー特売",
        "魚": "魚コーナー特売",
        "野菜": "野菜コーナー特売",
        "その他特売": "その他特売",
        "新商品": "新商品情報"
      };

      for (const item of data) {
        const li = document.createElement("li");
        const link = document.createElement("a");

        link.href =
          "products.html?category=" + encodeURIComponent(item.name);
        link.textContent = standardLabels[item.name] || item.name;

        li.appendChild(link);
        list.appendChild(li);
      }
    }

    async function loadAnnouncements() {
      const area = document.getElementById("announcements");

      const { data, error } = await supabaseClient
        .from("announcements")
        .select("message, link_url, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        area.textContent = "お知らせを読み込めませんでした。";
        area.className = "error";
        console.error("お知らせ読込エラー:", error.message);
        return;
      }

      area.replaceChildren();

      if (!data || data.length === 0) {
        area.textContent = "現在お知らせはありません。";
        return;
      }

      for (const item of data) {
        const announcement = document.createElement("section");
        announcement.className = "announcement";

        let safeUrl = null;

        if (item.link_url) {
          try {
            const url = new URL(item.link_url);

            if (url.protocol === "https:" || url.protocol === "http:") {
              safeUrl = url.href;
            }
          } catch {
            // URLが正しくない場合は、通常の文字として表示します
          }
        }

        if (safeUrl) {
          const messageLink = document.createElement("a");
          messageLink.href = safeUrl;
          messageLink.textContent = item.message || "";
          messageLink.target = "_blank";
          messageLink.rel = "noopener noreferrer";
          announcement.appendChild(messageLink);
        } else {
          const message = document.createElement("p");
          message.textContent = item.message || "";
          announcement.appendChild(message);
        }

        if (item.created_at) {
          const date = document.createElement("div");
          date.className = "announcement-date";
          date.textContent =
            new Date(item.created_at).toLocaleDateString("ja-JP", {
              timeZone: "Asia/Tokyo"
            });
          announcement.appendChild(date);
        }

        area.appendChild(announcement);
      }
    }

    loadCategories();
    loadAnnouncements();
  </script>
</body>
</html>
