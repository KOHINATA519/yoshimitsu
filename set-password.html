<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード設定｜スーパー吉光</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { max-width: 720px; margin: auto; padding: 20px; font: 20px/1.7 Arial, sans-serif; }
    input, button { box-sizing: border-box; width: 100%; padding: 10px; margin: 6px 0 14px; font-size: 20px; }
    button { cursor: pointer; }
    .error { color: #b00020; } .success { color: #087a32; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>パスワード設定</h1>
  <p>招待された管理者アカウントのパスワードを設定してください。</p>

  <main id="formPanel" hidden>
    <label for="newPassword">新しいパスワード（8文字以上）</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="8">
    <label for="confirmPassword">新しいパスワード（確認）</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8">
    <button id="saveButton" type="button">パスワードを設定</button>
  </main>

  <section id="recoveryPanel" hidden>
    <p>招待を開いてもパスワード設定画面にならない場合は、登録したメールアドレスへ設定用リンクを送れます。</p>
    <label for="recoveryEmail">メールアドレス</label>
    <input id="recoveryEmail" type="email" autocomplete="email" placeholder="管理者のメールアドレス">
    <button id="sendRecoveryButton" type="button">パスワード設定リンクを送る</button>
  </section>

  <p id="status" aria-live="polite">招待情報を確認しています...</p>

  <script>
    const SUPABASE_URL = "https://llxysqzozhnikuznsuwy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uv_8zUNxYc1tebjvnukzdg_nNF6kAip";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const params = new URLSearchParams(location.search);
    const status = document.getElementById("status");

    function setStatus(message, className) {
      status.textContent = message;
      status.className = className || "";
    }

    async function init() {
      // Supabase SDK processes invitation/recovery tokens in the URL and stores the session.
      const { data, error } = await client.auth.getSession();
      if (error || !data.session) {
        document.getElementById("recoveryPanel").hidden = false;
        setStatus("招待リンクが無効か期限切れです。招待メールを再送してもらい、メールのリンクを開いてください。", "error");
        return;
      }
      document.getElementById("formPanel").hidden = false;
      setStatus("新しいパスワードを入力してください。");
    }

    document.getElementById("saveButton").addEventListener("click", async function() {
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      const button = this;
      if (password.length < 8) {
        setStatus("パスワードは8文字以上で入力してください。", "error");
        return;
      }
      if (password !== confirmation) {
        setStatus("確認用パスワードが一致しません。", "error");
        return;
      }

      button.disabled = true;
      setStatus("パスワードを設定しています...");
      const { error } = await client.auth.updateUser({ password: password });
      button.disabled = false;
      if (error) {
        setStatus("設定できませんでした：" + error.message, "error");
        return;
      }

      setStatus("設定しました。管理画面へ移動します。", "success");
      const store = params.get("store");
      const next = params.get("next");
      const destination = next === "admin" && store
        ? "admin.html?store=" + encodeURIComponent(store)
        : "hq.html";
      setTimeout(function() { location.replace(destination); }, 800);
    });

    document.getElementById("sendRecoveryButton").addEventListener("click", async function() {
      const email = document.getElementById("recoveryEmail").value.trim();
      if (!email) {
        setStatus("メールアドレスを入力してください。", "error");
        return;
      }
      const button = this;
      button.disabled = true;
      const redirectTo = location.origin + location.pathname + "?next=hq";
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
      button.disabled = false;
      if (error) {
        setStatus("メールを送れませんでした：" + error.message, "error");
        return;
      }
      setStatus("アカウントがある場合は、パスワード設定リンクをメールで送信しました。メール内のリンクを開いてください。");
    });

    init();
  </script>
</body>
</html>
