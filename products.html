<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品一覧｜スーパー吉光</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      font-size: 22px;
      line-height: 1.8;
      font-family: Arial, sans-serif;
    }

    a { font-size: 1.1em; }

    button {
      font-size: 20px;
      margin: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .updated-date {
      color: #666;
      font-size: 18px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 12px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .error { color: #b00020; }
  </style>
</head>

<body>
  <h1 id="pageTitle">商品一覧</h1>

  <p><a href="index.html">トップページへ戻る</a></p>

  <button type="button" onclick="document.body.style.fontSize='30px'">
    文字を大きくする
  </button>

  <button type="button" onclick="document.body.style.fontSize='22px'">
    元に戻す
  </button>

  <p id="lastUpdated" class="updated-date" aria-live="polite"></p>
  <div id="products" aria-live="polite">商品を読み込んでいます...</div>

  <script>
    const SUPABASE_URL = "https://llxysqzozhnikuznsuwy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_uv_8zUNxYc1tebjvnukzdg_nNF6kAip";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const category = new URLSearchParams(location.search).get("category");
    const title = document.getElementById("pageTitle");
    const area = document.getElementById("products");
    const updatedArea = document.getElementById("lastUpdated");

    if (!category) {
      title.textContent = "カテゴリーが指定されていません";
      area.textContent = "トップページからカテゴリーを選んでください。";
    } else {
      title.textContent =
        category === "新商品"
          ? "新商品情報"
          : category + (category === "その他特売" ? "" : "の特売品コーナー");

      document.title = title.textContent + "｜スーパー吉光";
      loadProducts(category);
    }

    async function loadProducts(categoryName) {
      // URLのカテゴリーが現在のカテゴリー一覧に存在するか確認
      const { data: categoryData, error: categoryError } =
        await supabaseClient
          .from("categories")
          .select("name")
          .eq("name", categoryName)
          .maybeSingle();

      if (categoryError) {
        title.textContent = "カテゴリーを確認できませんでした";
        area.textContent = "カテゴリーを読み込めません。時間をおいて再度お試しください。";
        console.error("カテゴリー確認エラー:", categoryError.message);
        return;
      }

      if (!categoryData) {
        title.textContent = "カテゴリーが見つかりません";
        area.textContent = "このカテゴリーは削除されたか、登録されていません。";
        return;
      }

      const { data, error } = await supabaseClient
        .from("products")
        .select("product_name, price, corner, created_at, updated_at")
        .eq("category", categoryName)
        .order("updated_at", { ascending: false });

      if (error) {
        area.textContent = "商品を読み込めませんでした。";
        console.error("商品読込エラー:", error.message);
        return;
      }

      if (!data || data.length === 0) {
        updatedArea.textContent = "最終更新日：まだ商品がありません";
        area.textContent = "このカテゴリーの商品はまだありません。";
        return;
      }

      const lastUpdate = data[0].updated_at || data[0].created_at;

      if (lastUpdate) {
        updatedArea.textContent =
          "最終更新日：" +
          new Intl.DateTimeFormat("ja-JP", {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).format(new Date(lastUpdate));
      }

      area.replaceChildren();

      for (const item of data) {
        const card = document.createElement("section");
        card.className = "card";

        const name = document.createElement("h2");
        name.textContent = item.product_name || "商品名未設定";
        card.appendChild(name);

        const price = document.createElement("p");
        price.textContent = "価格：" + (item.price || "未設定");
        card.appendChild(price);

        const corner = document.createElement("p");
        corner.textContent = "陳列コーナー：" + (item.corner || "未設定");
        card.appendChild(corner);

        area.appendChild(card);
      }
    }
  </script>
</body>
</html>
